trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  TF_VERSION: '1.5.0'

steps:

# Install Terraform
- task: TerraformInstaller@1
  inputs:
    terraformVersion: $(TF_VERSION)

# Terraform Init
- task: TerraformTaskV4@4
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)'
    backendServiceArm: 'azure-sp-connection'
    backendAzureRmResourceGroupName: 'rg-backend'
    backendAzureRmStorageAccountName: 'tfstatebackend123'
    backendAzureRmContainerName: 'tfstate'
    backendAzureRmKey: 'rg.tfstate'

# Terraform Plan
- task: TerraformTaskV4@4
  inputs:
    provider: 'azurerm'
    command: 'plan'
    workingDirectory: '$(System.DefaultWorkingDirectory)'
    environmentServiceNameAzureRM: 'azure-sp-connection'

# Terraform Apply
- task: TerraformTaskV4@4
  inputs:
    provider: 'azurerm'
    command: 'apply'
    workingDirectory: '$(System.DefaultWorkingDirectory)'
    environmentServiceNameAzureRM: 'azure-sp-connection'
    args: '-auto-approve'